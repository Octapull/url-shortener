<img src="/octapull-logo.png" alt="Octapull" class="brand logo" />
<div class="top-right">
  <span *ngIf="isAdmin()" class="admin-badge">ADMIN</span>
  <button *ngIf="isSignedIn()" class="logout-btn" (click)="onLogout()">
    <i class="fas fa-sign-out-alt"></i>
    <span>Logout</span>
  </button>
</div>

<div class="center-layout">
  <div class="content-wrapper" [ngClass]="{ 'signed-stack': isSignedIn() }">
    <div class="component-section" *ngIf="!isSignedIn()">
      <app-url-shortener></app-url-shortener>
    </div>

    <div class="text-content" *ngIf="!isSignedIn()">
      <h1 class="main-title">Octapull URL Shortener</h1>
      <p class="subtitle">Your link, but shorter.</p>
      <p class="description">Want more out of your link shortener? Sign in to unlock advanced features: track detailed link analytics, manage your URLs, and access your personalized dashboard.</p>
      <div class="signin-section">
        <button class="google-btn" type="button" (click)="onGoogleSignIn()">
          <svg class="google-icon" viewBox="0 0 533.5 544.3" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="266.75" cy="272.15" r="260" />
            <path fill="#EA4335" d="M533.5 278.4c0-18.6-1.5-37.1-4.6-55.1H272.1v104.3h147.2c-6.3 34.1-25 63-53.4 82.3v68 h86.5c50.7-46.7 81.1-115.6 81.1-199.5z"/>
            <path fill="#34A853" d="M272.1 544.3c72.9 0 134.2-24.1 178.9-65.4l-86.5-68c-24 16.1-54.8 25.6-92.4 25.6-70.9 0-131-47.8-152.6-112.1h-89.5v70.3c44.5 88.2 136.3 149.6 242.1 149.6z"/>
            <path fill="#4285F4" d="M119.5 324.4c-10.1-30.1-10.1-62.3 0-92.4v-70.3H30C-10 203.6-10 340.7 30 432.4l89.5-70.3z"/>
            <path fill="#FBBC05" d="M272.1 107.7c39.6-.6 77.7 14.5 106.7 42.6l-80-80C413.5 24.1 351.9 0 272.1 0 166.3 0 74.5 61.4 30 149.6l89.5 70.3C141.1 155.6 201.2 107.7 272.1 107.7z"/>
          </svg>
          <span class="google-btn-text">Continue with Google</span>
        </button>
      </div>
    </div>

    <div *ngIf="isSignedIn()" class="signed-stack-block" [ngClass]="{ 'collapsed-wide': !panelExpanded() }">
      <div class="greeting">Hello! {{ username() }}</div>
      <app-quick-shortener (shorten)="onQuickShorten($event)"></app-quick-shortener>
    </div>

    <app-admin-panel
      *ngIf="isSignedIn()"
      class="collapsed-wide"
      [ngClass]="{ 'collapsed-wide': !panelExpanded() }"
      [links]="links()"
      [signedIn]="isSignedIn()"
      [expanded]="panelExpanded()"
      [isAdmin]="isAdmin()"
      [token]="token()"
      (toggle)="togglePanel()"
      (close)="closePanel($event)"
      (changed)="refreshUrls()"
    ></app-admin-panel>
  </div>
</div>
