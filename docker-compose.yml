version: '3.8'

services:
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=urlshortener;Username=postgres;Password=postgres
      # Optional: Add redis connection if configured via env
      - RedisOptions__Configuration=redis:6379
      # JWT Ayarları (Eksik olan kısım)
      - JwtOptions__SigningKey=bu_cok_gizli_ve_en_az_32_karakter_uzunlugunda_bir_jwt_secret_key_123456
      - JwtOptions__Issuer=urlshortener
      - JwtOptions__Audience=urlshortener
      # Set CORS for ui container if needed
      - AllowedHosts=*
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  ui:
    build:
      context: ./src/ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortener"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  
